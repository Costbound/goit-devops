image:
  repository: 615299736927.dkr.ecr.us-east-1.amazonaws.com/lesson-8-9/django-app
  tag: "428c314"
  pullPolicy: Always

replicaCount: 2

service:
  type: LoadBalancer
  port: 80
  targetPort: 8000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

hpa:
  minReplicas: 2
  maxReplicas: 6
  cpuUtilizationPercentage: 70

config:
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_DB: django_db
  POSTGRES_USER: "" # set in secrets.yaml
  POSTGRES_PASSWORD: "" # set in secrets.yaml
  SECRET_KEY: "" # set in secrets.yaml
  ALLOWED_HOSTS: "*"
  DEBUG: "False"

# PostgreSQL — runs inside Kubernetes
# For demo/development only. For production use AWS RDS instead.
db:
  image: postgres:15-alpine
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
