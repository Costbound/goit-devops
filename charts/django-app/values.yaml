image:
  repository: 615299736927.dkr.ecr.us-east-1.amazonaws.com/lesson-db-module/django-app
  tag: a377e27
  pullPolicy: Always

replicaCount: 2

service:
  type: LoadBalancer
  port: 80
  targetPort: 8000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

hpa:
  minReplicas: 2
  maxReplicas: 6
  cpuUtilizationPercentage: 70

config:
  POSTGRES_HOST: ""  # Injected at deploy time via django-app-secrets (RDS endpoint)
  POSTGRES_PORT: "5432"
  POSTGRES_DB: django_db
  ALLOWED_HOSTS: "*"
  DEBUG: "False"
