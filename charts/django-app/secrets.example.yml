# Copy this file to secrets.yml and fill in real values.
# secrets.yml is gitignored and must be created locally by each developer.
#
# Usage:
#   helm install django-app ./charts/django-app \
#     -f charts/django-app/values.yaml \
#     -f charts/django-app/secrets.yml

# ECR image — replace YOUR_ACCOUNT_ID with your AWS account ID
image:
  repository: YOUR_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/lesson7/django-app

# Django app environment variables injected via ConfigMap
config:
  POSTGRES_USER: your_db_user
  POSTGRES_PASSWORD: your_db_password

# PostgreSQL sub-chart (runs inside Kubernetes, not RDS)
# Bitnami PostgreSQL chart — used for development/demo purposes
# For production, replace with an RDS instance and set POSTGRES_HOST to the RDS endpoint
postgresql:
  auth:
    password: your_db_password # must match config.POSTGRES_PASSWORD above
